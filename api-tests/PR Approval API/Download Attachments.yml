info:
  name: Download Attachments
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/api/pr/{{prId}}/attachments/{{attachmentId}}/download"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("download returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("response is an attachment", function () {
          const disposition = res.getHeader("content-disposition");

          expect(disposition).to.include("attachment");
        });

        test("response has content type", function () {
          const contentType = res.getHeader("content-type");

          expect(contentType).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
