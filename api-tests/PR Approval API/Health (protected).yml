info:
  name: Health (protected)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/health"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
