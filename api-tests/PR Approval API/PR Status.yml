info:
  name: PR Status
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/pr/{{prId}}/status"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
