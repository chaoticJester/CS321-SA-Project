info:
  name: GET PR LIST
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/pr?page=1&limit=20"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
