info:
  name: Create PR - Success
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/pr"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "require_date": "2026-10-30T00:00:00Z",
        "job_name": "Notebook",
        "items": [
          { "description": "Notebook HP",
            "qty": 5, "unit": "set", 
            "unit_price": 22000 
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("prId", res.body.pr_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
