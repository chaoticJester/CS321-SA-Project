info:
  name: Upload PR Attachment - Success
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/pr/PR1ad85a2b84085573/attachments"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - E:\University\EngGame\Journal\J11-17-09-26.pdf
        contentType: application/pdf
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        bru.setVar("prId", body.pr_id);
        bru.setVar("attachmentId", body.attachment_id);
    - type: tests
      code: |-
        test("upload returns 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("response contains attachment id", function () {
          const body = res.getBody();

          expect(body).to.have.property("attachment_id");
          expect(body).to.have.property("file_path");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
