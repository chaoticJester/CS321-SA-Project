http:
  method: POST
  url: "{{baseUrl}}/api/pr/{{prId}}/resubmit"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "require_date": "not a date",
        "items": []
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
