info:
  name: GET PR APPROVED/REJECTED LIST
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/pr?status=approved,rejected"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: status
      value: approved,rejected
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
