info:
  name: Reject PR
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/pr/{{prId}}/reject"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: '{ "reason": "spec incomplete" }'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
