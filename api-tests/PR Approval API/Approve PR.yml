info:
  name: Approve PR
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/pr/{{prId}}/approve"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: '{ "passcode": "123456" }'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
